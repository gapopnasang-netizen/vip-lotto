<div id="loginApp" class="max-w-md mx-auto mt-20 bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
    <h2 class="text-xl font-bold text-white mb-4"><i class="fa-solid fa-right-to-bracket text-amber-400 mr-2"></i> เข้าสู่ระบบ VIP LOTTO</h2>
    
    <div class="space-y-4">
        <div>
            <label class="block text-xs text-slate-400 mb-1">ชื่อผู้ใช้งาน</label>
            <input v-model="username" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:border-amber-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">รหัสผ่าน</label>
            <input v-model="password" type="password" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:border-amber-500 focus:outline-none">
        </div>
        <button @click="handleLogin" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl transition">
            เข้าสู่ระบบ
        </button>
    </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
    const { createApp, ref } = Vue;
    createApp({
        setup() {
            const username = ref('');
            const password = ref('');

            const handleLogin = async () => {
                try {
                    const res = await fetch('http://localhost:3000/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: username.value, password: password.value })
                    });
                    const data = await res.json();
                    if (data.success) {
                        // บันทึก Token และข้อมูลลงในเครื่อง
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('username', data.username);
                        alert('เข้าสู่ระบบสำเร็จ!');
                        window.location.href = 'bet-terminal.html'; // พาไปหน้าแทงหวย
                    } else {
                        alert('ผิดพลาด: ' + data.message);
                    }
                } catch (err) {
                    console.error(err);
                    alert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
                }
            };
            return { username, password, handleLogin };
        }
    }).mount('#loginApp');
</script>
